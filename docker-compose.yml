version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bitcommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bitcommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bitcommerce_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Mailpit — local SMTP catcher & email preview
  # SMTP: localhost:1025  (no auth required)
  # Web UI: http://localhost:8025
  # ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: bitcommerce_mailpit
    restart: always
    ports:
      - "1025:1025"   # SMTP — backend sends mail here
      - "8025:8025"   # Web UI — browse captured emails
    environment:
      MP_MAX_MESSAGES: 200           # keep last 200 emails
      MP_DATABASE: /data/mailpit.db  # persist across restarts
      MP_SMTP_AUTH_ACCEPT_ANY: true  # accept any SMTP credentials
      MP_SMTP_AUTH_ALLOW_INSECURE: true
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
